<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINE ORG Mini App</title>
    <!-- Telegram Web App JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #e50914;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--accent-color);
            font-size: 24px;
            margin: 0 0 6px 0;
            letter-spacing: 1px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 13px;
            margin: 0;
        }

        .search-box {
            width: 100%;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #333;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #2a2a2a;
        }

        .movie-poster {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #2b2b2b;
        }

        .movie-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .movie-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-code {
            font-size: 12px;
            color: var(--accent-color);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .btn-watch {
            margin-top: auto;
            width: 100%;
            padding: 8px 0;
            border: none;
            border-radius: 6px;
            background-color: var(--accent-color);
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>CINE ORG</h1>
        <p id="user-greeting">Premyeralar kataloqi</p>
    </div>

    <div class="search-box">
        <input type="text" id="search" placeholder="Kino nomi yoki kodi..." onkeyup="filterMovies()">
    </div>

    <div class="movies-grid" id="movies-container">
        <!-- Kinolar ro'yxati JS orqali yuklanadi -->
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Oynani to'liq ekranga yozish

        // Foydalanuvchi ismini chiqarish
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-greeting').innerText = `Xush kelibsiz, ${tg.initDataUnsafe.user.first_name}!`;
        }

        // Namunaviy kinolar bazasi (kod va ma'lumotlar)
        const movies = [
            { title: "Forsaj 10", code: "101", poster: "https://via.placeholder.com/150x200/1e1e1e/fff?text=Forsaj+10" },
            { title: "Avatar 2", code: "102", poster: "https://via.placeholder.com/150x200/1e1e1e/fff?text=Avatar+2" },
            { title: "O'rmon bolasi", code: "103", poster: "https://via.placeholder.com/150x200/1e1e1e/fff?text=Kino+103" },
            { title: "Mantiqiy Qasos", code: "104", poster: "https://via.placeholder.com/150x200/1e1e1e/fff?text=Kino+104" }
        ];

        function renderMovies(list) {
            const container = document.getElementById('movies-container');
            container.innerHTML = '';
            list.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${movie.poster}" class="movie-poster" alt="${movie.title}">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-code">Kodi: ${movie.code}</div>
                        <button class="btn-watch" onclick="sendCode('${movie.code}')">Kodni Botga yuborish</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Kodni botga qaytarib yuborish va ilovani yopish
        function sendCode(code) {
            tg.sendData(code);
        }

        function filterMovies() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = movies.filter(m => 
                m.title.toLowerCase().includes(query) || m.code.includes(query)
            );
            renderMovies(filtered);
        }

        renderMovies(movies);
    </script>
</body>
</html>
